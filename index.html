<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1718">
<title>Obras H3</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Obras H3">
<style>
  html,body{margin:0;height:100%;background:#1b1718;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbwYmOd31ZRVWn-qIoV_KIJdMIvERXjO6TxkDF9x6Gm3tALbkth5Bns-pD4AdXAjxHugmA/exec" title="Obras H3" allow="clipboard-write; fullscreen"></iframe>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
// Guarda la sesión aquí, porque el iPhone borra la del recuadro de Google cada vez que se abre la app desde el inicio.
(function(){var K='obras-h3-token',ok=/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
window.addEventListener('message',function(e){if(!ok.test(e.origin))return;var d=e.data||{};
  if(d.h3==='ask'){var t='';try{t=localStorage.getItem(K)||''}catch(x){}e.source.postMessage({h3:'token',token:t},e.origin)}
  else if(d.h3==='token'){try{if(/^[a-f0-9]{64}$/.test(d.token||''))localStorage.setItem(K,d.token);else localStorage.removeItem(K)}catch(x){}}
});})();
</script>
</body>
</html>
