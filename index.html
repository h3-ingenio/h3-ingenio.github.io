<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1718">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Obras H3">
<title>Obras H3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral oscura con la marca H3, área de trabajo clara con pestañas; rojo H3 para lo principal, gris del logo para datos secundarios */
:root{
  --bg:#f5f4f4; --surface:#ffffff; --surface-2:#f3f1f1; --line:#e4e0e1; --text:#2a2627; --muted:#6f696b;
  --accent:#d2202f; --accent-soft:#fbe7e9; --hover:#eeeaea; --brand:#5f5a5c;
  --side:#2a2627; --side-2:#36312f; --side-text:#ece9ea; --side-muted:#a49c9e;
  --ok:#00a35c; --warn:#f29b2e; --bad:#d2202f;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Rajdhani","Public Sans",system-ui,sans-serif;
  --shadow:0 6px 22px rgba(42,38,39,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141213; --surface:#1d1a1b; --surface-2:#262223; --line:#363031; --text:#ece9ea; --muted:#a19a9c;
    --accent:#f0525d; --accent-soft:#3b1b1f; --hover:#2c2729; --brand:#bdb8ba;
    --side:#0e0c0d; --side-2:#1d1a1b; --shadow:0 6px 22px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141213; --surface:#1d1a1b; --surface-2:#262223; --line:#363031; --text:#ece9ea; --muted:#a19a9c;
  --accent:#f0525d; --accent-soft:#3b1b1f; --hover:#2c2729; --brand:#bdb8ba;
  --side:#0e0c0d; --side-2:#1d1a1b; --shadow:0 6px 22px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:flex;height:100%}
/* barra lateral */
.side{width:250px;flex:none;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:18px 16px 14px;border-bottom:3px solid var(--accent)}
.wm{display:flex;align-items:center;gap:10px}
.wm-h3{font:700 34px/1 var(--font-display);color:#fff;background:var(--accent);padding:4px 9px 2px;border-radius:4px;letter-spacing:.02em}
.wm-t{font:700 13px/1.05 var(--font-display);letter-spacing:.16em;color:var(--side-text)}
.ws-sub{font-size:11.5px;color:var(--side-muted);margin-top:10px;letter-spacing:.06em;text-transform:uppercase}
.side nav{padding:10px 8px;overflow:auto;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:6px;text-align:left;color:var(--side-text)}
.nav-item:hover{background:var(--side-2)}
.nav-item.on{background:var(--accent);color:#fff;font-weight:600}
.nav-item .dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:9px}
.nav-label{font:600 12px var(--font-display);color:var(--side-muted);padding:16px 10px 6px;text-transform:uppercase;letter-spacing:.14em}
.btn-new{margin:10px;padding:10px;border:1px dashed rgba(255,255,255,.25);border-radius:6px;background:none;color:var(--side-text);font-weight:600}
.btn-new:hover{border-color:var(--accent);background:var(--accent);color:#fff}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
#crumb{font:700 17px var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--brand)}
.menu-btn{display:none;border:0;background:none;padding:6px;border-radius:6px}
.conn{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn.live i{background:var(--ok)} .conn.warn i{background:var(--warn)}
main{flex:1;overflow:auto;padding:20px 24px 80px}
/* encabezado de tablero */
.b-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 20px;margin-bottom:12px}
.b-title{font:700 30px/1.1 var(--font-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.b-meta{color:var(--muted);font-size:13px;margin-top:4px}
.b-kpis{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.kpi-mini{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:110px}
.kpi-mini b{display:block;font:600 16px var(--font-display);font-variant-numeric:tabular-nums}
.kpi-mini span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab{font:600 16px var(--font-display);letter-spacing:.03em}
.tab:hover{color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
a.btn{text-decoration:none;color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1.2}
a.btn.primary{color:#fff}
a.btn:hover{text-decoration:none}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.inp,.sel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.search{min-width:180px}
.icon-btn{border:0;background:none;padding:4px;border-radius:4px;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--hover);color:var(--text)}
/* tabla tipo monday */
.board-scroll{overflow-x:auto;padding-bottom:6px}
.group{margin-bottom:26px;min-width:1080px}
.g-head{display:flex;align-items:center;gap:8px;padding:4px 0 8px;position:sticky;left:0;width:max-content}
.g-name{font:700 19px var(--font-display);letter-spacing:.02em;color:var(--g);border:0;background:none;padding:2px 4px;border-radius:4px}
.g-name:hover{background:var(--hover)}
.g-count{font-size:12px;color:var(--muted)}
.g-new{margin-left:10px;border:1px solid var(--g);color:var(--g);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.g-new:hover{background:var(--g);color:#fff}
.chev{transition:transform .15s;color:var(--g)}
.collapsed .chev{transform:rotate(-90deg)}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;background:var(--surface)}
.tbl th{font-weight:500;font-size:12.5px;color:var(--muted);padding:7px 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;background:var(--surface)}
.tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:38px;padding:0;text-align:center;vertical-align:middle;font-size:13px}
.tbl th.c-name,.tbl td.c-name{text-align:left;position:sticky;left:0;z-index:2;background:var(--surface);border-left:6px solid var(--g)}
.tbl th.c-name{border-top-left-radius:6px}
.tbl tr:hover td{background:var(--surface-2)}
.tbl tr:hover td.c-name{background:var(--surface-2)}
.name-cell{display:flex;align-items:center;gap:4px;padding:0 6px 0 10px}
.name-in{flex:1;min-width:0;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:4px}
.name-in:hover{border-color:var(--line)}
.name-in:focus{border-color:var(--accent);background:var(--surface);outline:0}
.upd{position:relative;color:var(--muted)}
.upd em{position:absolute;top:-3px;right:-4px;background:var(--accent);color:#fff;font:600 9px/14px var(--font-body);min-width:14px;height:14px;border-radius:7px;font-style:normal;padding:0 3px}
td.lbl{color:#fff;font-weight:500;cursor:pointer;transition:filter .1s}
td.lbl:hover{filter:brightness(1.07)}
td.lbl.empty{background:var(--surface-2);color:var(--muted)}
.person{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:0 6px;cursor:pointer;border:0;background:none;height:100%;width:100%;justify-content:center}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:600;flex:none}
.av.none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.person .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.tl{margin:0 8px;height:24px;border-radius:12px;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums;border:0;width:calc(100% - 16px)}
.tl.none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.tl.late{box-shadow:0 0 0 2px var(--bad)}
.prog{display:flex;align-items:center;gap:6px;padding:0 10px;cursor:pointer;border:0;background:none;width:100%;height:100%}
.bar{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.prog span{font-size:12px;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.num-in{width:100%;height:36px;border:1px solid transparent;background:transparent;text-align:right;padding:0 8px;font-variant-numeric:tabular-nums}
.num-in:focus{border-color:var(--accent);background:var(--surface);outline:0}
.money{padding:0 8px;text-align:right;display:block;font-variant-numeric:tabular-nums}
.over{color:var(--bad);font-weight:600}
.add-row td{height:36px}
.add-in{width:100%;border:0;background:transparent;padding:8px 12px;color:var(--text)}
.add-in::placeholder{color:var(--muted)}
.sum-row td{border:0;height:34px;background:transparent!important}
.sum-row td.c-name{background:var(--bg)!important;border-left-color:transparent}
.dist{display:flex;height:22px;margin:0 8px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.dist i{display:block;height:100%}
.sum{font-size:12px;color:var(--muted);text-align:right;padding:0 8px;font-variant-numeric:tabular-nums}
.sum b{color:var(--text);font-weight:600;display:block}
.add-group{margin-top:4px}
.w-name{width:340px}.w-per{width:130px}.w-st{width:130px}.w-pr{width:110px}.w-tl{width:180px}.w-pg{width:130px}.w-m{width:120px}
@media (max-width:600px){.w-name{width:200px}.w-per{width:70px}.w-st{width:110px}.w-pr{width:90px}.w-tl{width:150px}.w-pg{width:110px}.w-m{width:105px}.group{min-width:835px}.person .pn{display:none}}
/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:8px}
.kcol{flex:0 0 270px;background:var(--surface-2);border-radius:8px;border:1px solid var(--line)}
.kcol-h{color:#fff;font-weight:600;padding:9px 12px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between}
.kcol-b{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.kcol.drop{outline:2px dashed var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--g)}
.card:hover{box-shadow:var(--shadow)}
.card-t{font-weight:600}
.card-m{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--surface-2);color:var(--g);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.late-chip{color:var(--bad);font-weight:600}
/* gantt */
.gantt{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 260px)}
.gt{position:relative}
.grow{display:flex;min-height:34px;border-bottom:1px solid var(--line)}
.glabel{position:sticky;left:0;z-index:3;width:210px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;font-size:13px;display:flex;align-items:center;gap:6px;overflow:hidden}
.glabel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtrack{position:relative;flex:none}
.ghead{position:sticky;top:0;z-index:4;background:var(--surface)}
.ghead .glabel{z-index:5;font-weight:600;color:var(--muted)}
.gmonth{position:absolute;top:2px;font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;padding-left:4px;border-left:1px solid var(--line)}
.gweek{position:absolute;bottom:2px;font-size:10px;color:var(--muted);white-space:nowrap;padding-left:3px}
.ggroup .glabel{font-weight:600;color:var(--g)}
.ggroup{background:var(--surface-2)}
.ggroup .glabel{background:var(--surface-2)}
.gbar{position:absolute;top:7px;height:20px;border-radius:10px;background:var(--g);cursor:pointer;overflow:hidden;color:#fff;font-size:11px;line-height:20px;padding:0 8px;white-space:nowrap;min-width:8px}
.gbar i{position:absolute;inset:0 auto 0 0;background:rgba(0,0,0,.22)}
.gbar span{position:relative}
.gbar.late{box-shadow:0 0 0 2px var(--bad)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.gempty{padding:30px;color:var(--muted);text-align:center}
/* finanzas y panel */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .t{font-size:12px;color:var(--muted)}
.tile .v{font:700 26px/1.2 var(--font-display);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile.bad .v{color:var(--bad)} .tile.ok .v{color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:20px}
.panel h3{font:700 19px var(--font-display);margin:0 0 4px;letter-spacing:.02em}
.panel .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.dt-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.dt th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt .r{text-align:right}
.dt tr.total td{font-weight:700;border-top:2px solid var(--text)}
.dt tr.sub td{font-weight:600}
.dt tr.pctrow td{font-style:italic;color:var(--muted)}
.dt .neg{color:var(--bad)}
.dt input,.dt select{width:100%;min-width:90px;border:1px solid var(--line);border-radius:5px;padding:5px 6px;background:var(--surface)}
.dt tr.form td{background:var(--surface-2)}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
.cbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.cbar .lab{width:150px;flex:none}
.cbar .tr{flex:1;height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.cbar .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.cbar .val{width:110px;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;color:#fff}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px}
/* usuarios */
body.auth .side,body.auth .topbar,body.auth .scrim{display:none}
.login{min-height:100%;display:grid;place-items:center;padding:20px 0}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:12px;padding:26px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.login-card h1{font:700 26px/1.1 var(--font-display);margin:10px 0 0}
.login-card label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.login-card .inp{width:100%;padding:10px 12px;font-size:16px}
.login-card .btn{padding:11px;font-size:15px}
.lg-err{color:var(--bad);font-size:13px;min-height:1em;margin:0}
.me{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.1)}
.me-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.me-t b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-t span{font-size:11.5px;color:var(--side-muted)}
.ulist{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:0}
.ulist legend{font-size:12.5px;color:var(--muted);padding:0 4px}
.ulist .check{font-size:13.5px;color:var(--text)}
.ulist .hint{grid-column:1/-1}
.nofin .group{min-width:840px}
@media (max-width:600px){.nofin .group{min-width:650px}.ulist{grid-template-columns:1fr}}
.role{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;background:var(--surface-2)}
.role.admin{background:var(--accent);color:#fff}
.role.sec{background:var(--brand);color:#fff}
.sec-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:16px;padding:6px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .dot{width:9px;height:9px;border-radius:50%}
/* fotos */
.ph-up{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.ph-up label.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ph-prog{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ph-prog .bar{width:120px;flex:none}
.bar i.indet{width:40%;animation:ind 1.2s ease-in-out infinite;position:relative}
@keyframes ind{0%{margin-left:-40%}100%{margin-left:100%}}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:6px}
.ph{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.ph-img{border:0;padding:0;background:var(--surface-2);border-radius:8px;overflow:hidden;aspect-ratio:4/3;display:block;width:100%;cursor:zoom-in}
.ph-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.ph-img:hover img{transform:scale(1.04)}
.ph-load{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--surface-2),var(--hover),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.ph-cap{border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:4px;font-size:12.5px;width:100%}
.ph-cap:hover{border-color:var(--line)} .ph-cap:focus{border-color:var(--accent);background:var(--surface);outline:0}
.ph figcaption{font-size:11.5px;color:var(--muted);padding:0 4px}

<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim" data-act="close-side"></div>
  <div class="main-wrap">
    <header class="topbar">
      <button class="menu-btn" data-act="open-side" aria-label="Abrir menú de obras">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
      </button>
      <div id="crumb" style="font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
      <div class="conn" id="conn"><i></i><span>Conectando</span></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="drawer" id="drawer" aria-hidden="true"></div>
<div class="pop" id="pop" hidden></div>
<div class="modal-back" id="modal" hidden></div>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ---------- catálogos ---------- */
const STATUS=[
  {k:"pend",label:"Sin iniciar",c:"#c4c4c4"},
  {k:"curso",label:"En curso",c:"#fdab3d"},
  {k:"det",label:"Detenido",c:"#e2445c"},
  {k:"rev",label:"En revisión",c:"#a25ddc"},
  {k:"listo",label:"Listo",c:"#00c875"}
];
const EXPORT={run:null};
const HIST={load:null};
const PRIOR=[
  {k:"crit",label:"Crítica",c:"#333333"},
  {k:"alta",label:"Alta",c:"#401694"},
  {k:"media",label:"Media",c:"#5559df"},
  {k:"baja",label:"Baja",c:"#579bfc"}
];
const GCOLORS=["#579bfc","#a25ddc","#00c875","#fdab3d","#e2445c","#ff158a","#037f4c","#784bd1","#0086c0","#bb3354"];
const CONCEPTS=["Materiales","Mano de obra","Subcontratos","Maquinaria y equipo","Indirectos de obra"];
const INC_TYPES=["Anticipo","Estimación","Finiquito","Otro ingreso"];
const METODOS=[{k:"efectivo",label:"Efectivo",c:"#00a36c"},{k:"transferencia",label:"Transferencia",c:"#579bfc"},{k:"retiro",label:"Costo de retiro de efectivo",short:"Retiro de efectivo",c:"#a25ddc"}];
const PAGOS=METODOS.filter(m=>m.k!=="retiro");
function retPct(){try{const v=localStorage.getItem("obras-ret-pct");return v==null?"":v}catch(e){return ""}}
function saveRetPct(v){try{localStorage.setItem("obras-ret-pct",String(v))}catch(e){}}
const retCost=(amt,p)=>Math.round(num(amt)*num(p))/100;
function retNote(amt,p){const c=retCost(amt,p);return c>0?"= "+money(c)+" por disponer":""}
const metOf=k=>METODOS.find(m=>m.k===k)||{k:"",label:"Sin método",short:"Sin método",c:"#9b9b9b"};
const isPaid=g=>!(g.pagado===false||g.pagado==="FALSE");
const isCob=g=>g.collected===true||g.collected==="TRUE";
const OBRA_STATUS=[
  {k:"Por iniciar",c:"#c4c4c4"},{k:"En proceso",c:"#fdab3d"},{k:"Suspendida",c:"#e2445c"},{k:"Terminada",c:"#00c875"}
];
const DEFAULT_GROUPS=["Preliminares","Cimentación","Estructura","Instalaciones","Acabados"];
const OFICINA="oficina";
const FIJOS=[{k:"levantamientos",label:"Levantamientos",c:"#579bfc"},{k:"proyectos",label:"Proyectos",c:"#a25ddc"},{k:"cis",label:"CIS Osvaldo",c:"#fdab3d"},{k:"oficina",label:"Oficinas central",c:"#00a36c"}];
const canFijos=()=>canFin()&&isAdmin();
let ME=null;
const isAdmin=()=>!ME||ME.rol==="admin";
const SECCIONES=[{k:"residencial",label:"Residencial",c:"#579bfc"},{k:"gobierno",label:"Gobierno",c:"#00c875"},{k:"proyectos",label:"Proyectos",c:"#a25ddc"},{k:"presupuestos",label:"Presupuestos",c:"#fdab3d"},{k:"privados",label:"Privados",c:"#e2445c"}];
const secOf=k=>SECCIONES.find(s=>s.k===k);
const secLabel=k=>(secOf(k)||{label:"Sin sección"}).label;
const isSecAdmin=()=>!!ME&&ME.rol==="admin_sec";
const mySecs=()=>isSecAdmin()?SECCIONES.filter(s=>(ME.secciones||[]).includes(s.k)):SECCIONES;
const canDelBoard=b=>isAdmin()||(isSecAdmin()&&!!b&&(ME.secciones||[]).includes(b.seccion));
const roleLabel=u=>u.rol==="admin"?"Administrador general":u.rol==="admin_sec"?"Administrador de "+((u.secciones||[]).map(secLabel).join(", ")||"sección"):"Usuario";
const canFin=()=>!ME||ME.rol==="admin"||!!ME.finanzas;
const AUTH={};
const MONTHS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const fmtM=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0});
const money=n=>fmtM.format(Math.round(Number(n)||0));
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const pct=n=>(isFinite(n)?Math.round(n*100):0)+"%";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>(typeof s==="string"&&/^\d{4}-\d{2}-\d{2}/.test(s))?new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)):null;
const today=()=>iso(new Date());
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const fmtD=s=>{const d=parse(s);if(!d)return"";return d.getDate()+" "+MONTHS[d.getMonth()].toLowerCase()};
const fmtDY=s=>{const d=parse(s);if(!d)return"";return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()};
const stOf=k=>STATUS.find(s=>s.k===k)||null;
const prOf=k=>PRIOR.find(s=>s.k===k)||null;
function hashColor(name){let h=0;for(const ch of String(name))h=(h*31+ch.charCodeAt(0))>>>0;return GCOLORS[h%GCOLORS.length]}
function initials(name){const p=String(name||"").trim().split(/\s+/).filter(Boolean);return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase()}
function avatar(name){if(!name)return '<span class="av none">+</span>';return '<span class="av" style="background:'+hashColor(name)+'">'+esc(initials(name))+'</span>'}
const icon={
  xls:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5"/></svg>',
  chat:'<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h12v9H8l-4 3z"/></svg>',
  chev:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5l4 4 4-4"/></svg>',
  dots:'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  home:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 7l6-5 6 5v7H2z"/></svg>',
  users:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7.5" cy="7" r="3"/><path d="M2 17c0-3 2.5-5 5.5-5s5.5 2 5.5 5M13 4.3a3 3 0 0 1 0 5.4M15 12.3c1.8.6 3 2.4 3 4.7"/></svg>',
  cam:'<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h3l1.5-2h5L14 6h3v10H3z"/><circle cx="10" cy="11" r="3"/></svg>',
  trash:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h10M6 4V2h4v2M5 4l1 10h4l1-10"/></svg>'
};

/* ---------- estado ---------- */
const S={
  boards:new Map(),items:new Map(),gastos:new Map(),ingresos:new Map(),fotos:new Map(),team:[],uploading:null,rItem:"",rFrom:"",rTo:"",
  mode:"loading",netNote:"",readOnly:false,
  view:"panel",boardId:null,tab:"tabla",search:"",fPerson:"",fStatus:"",onlyLate:false,
  drawer:null,collapsed:{},draft:{},authMode:false,authState:"login",authErr:"",authBusy:false,users:[],year:new Date().getFullYear(),
  avance:[],historial:[],histBoard:{},histBusy:{}
};
try{const v=JSON.parse(localStorage.getItem("obras-ui")||"{}");if(v.view)S.view=v.view;if(v.boardId)S.boardId=v.boardId;if(v.tab)S.tab=v.tab;}catch(e){}
function saveUi(){try{localStorage.setItem("obras-ui",JSON.stringify({view:S.view,boardId:S.boardId,tab:S.tab}))}catch(e){}}

let myName="";try{myName=localStorage.getItem("obras-nombre")||""}catch(e){}
let backend=false,ver=-1,pendingOps=[],flushing=false,flushTimer=null;
let TOKEN="";try{TOKEN=localStorage.getItem("obras-token")||localStorage.getItem("obras-h3-token")||""}catch(e){}
const EXEC_URL="https://script.google.com/macros/s/AKfycbwYmOd31ZRVWn-qIoV_KIJdMIvERXjO6TxkDF9x6Gm3tALbkth5Bns-pD4AdXAjxHugmA/exec";
async function rawApi(fn,...args){let r;try{r=await fetch(EXEC_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args}),redirect:"follow",cache:"no-store"})}catch(e){throw new Error("Sin conexión con el servidor.")}
  let j;try{j=await r.json()}catch(e){throw new Error("El servidor no respondió bien. Intenta otra vez.")}
  if(!j||!j.ok)throw new Error((j&&j.e)||"Algo falló. Intenta otra vez.");return j.r}
const TOP_ORIGIN="https://h3-ingenio.github.io";
function tellTop(t){}
function isAuthErr(e){return /\bAUTH\b/.test(String((e&&e.message)||e||""))}
async function api(fn,...args){try{return await rawApi(fn,TOKEN,...args)}catch(e){if(isAuthErr(e)){sessionLost()}throw e}}
function sessionLost(){TOKEN="";ME=null;try{localStorage.removeItem("obras-token")}catch(e){}tellTop("");S.authState="login";S.authErr="Tu sesión terminó. Vuelve a entrar.";["boards","items","gastos","ingresos","fotos"].forEach(c=>S[c]=new Map());S.avance=[];S.historial=[];S.histBoard={};thumbs.clear();fulls.clear();ver=-1;pendingOps=[];render()}

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3200)}
function canWrite(){return true}
function queueOp(op){if(!backend)return;pendingOps.push(op);renderConn();clearTimeout(flushTimer);flushTimer=setTimeout(flush,250)}
async function flush(){
  if(flushing||!pendingOps.length)return;
  flushing=true;const ops=pendingOps.splice(0);renderConn();
  let ok=false;
  for(let k=0;k<4&&!ok;k++){
    try{const r=await api("write",ops);if(r&&r.prev===ver)ver=r.version;ok=true;S.netNote="";histChanged()}
    catch(e){if(isAuthErr(e)||!TOKEN)return;const m=cleanErr(e);if(/permiso|Solo un administrador|no permitida/i.test(m)){toast(m);ver=-1;flushing=false;schedulePoll(0);return}S.netNote="No se pudo guardar, reintentando";renderConn();await new Promise(res=>setTimeout(res,2000*(k+1)))}
  }
  if(!ok){S.netNote="";ver=-1;toast("No se pudieron guardar los últimos cambios. Revisa tu conexión y vuelve a capturarlos.")}
  flushing=false;renderConn();if(pendingOps.length)flush();
}
function put(col,id,data){const body=Object.assign({},data);delete body.id;S[col].set(id,Object.assign({id},body));render();queueOp({op:"set",col,id,data:body})}
function patch(col,id,p){const cur=S[col].get(id);if(!cur)return;S[col].set(id,Object.assign({},cur,p));render();queueOp({op:"patch",col,id,data:p})}
function removeDoc(col,id){S[col].delete(id);render();queueOp({op:"delete",col,id})}
function saveTeam(list){S.team=list;render();queueOp({op:"set",col:"config",id:"team",data:{value:list}})}

/* ---------- fotos ---------- */
const thumbs=new Map(),fulls=new Map(),thumbReq=new Set();
const PH={
  enabled:()=>S.mode==="local",
  disabledMsg:"Las fotos se guardan en la versión publicada con Google Apps Script. En esta vista de Claude no están disponibles.",
  loadThumbs:null,
  async upload(meta,full,thumb){const id=uid();const m=Object.assign({id,createdAt:new Date().toISOString()},meta);delete m.boardName;delete m.name;S.fotos.set(id,m);thumbs.set(id,thumb);fulls.set(id,full);return m},
  async full(f){return fulls.get(f.id)||thumbs.get(f.id)||""},
  async remove(f){S.fotos.delete(f.id);render()},
  caption(f,txt){S.fotos.set(f.id,Object.assign({},f,{caption:txt}));render()}
};
const fotosOf=pred=>[...S.fotos.values()].filter(pred).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.createdAt).localeCompare(String(b.createdAt)));
function ensureThumbs(boardId){
  if(!PH.loadThumbs||thumbReq.has(boardId))return;
  if(![...S.fotos.values()].some(f=>f.boardId===boardId&&!thumbs.has(f.id)))return;
  thumbReq.add(boardId);
  PH.loadThumbs({boardId}).then(()=>{thumbReq.delete(boardId);render()}).catch(()=>{thumbReq.delete(boardId);toast("No se pudieron cargar las fotos.")});
}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u})}
function scaleTo(im,max,q){const w=im.naturalWidth,h=im.naturalHeight;const r=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
function fileDate(f){const d=f.lastModified?new Date(f.lastModified):null;return d&&!isNaN(d)?iso(d):today()}
async function uploadFiles(files,itemId){
  const it=S.items.get(itemId);if(!it)return;
  if(!myName){const keep=[...files];askName(()=>uploadFiles(keep,itemId));return}
  const list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if(!list.length){toast("Elige archivos de imagen.");return}
  S.uploading={itemId,done:0,total:list.length};render();
  let fails=0,lastErr="",next=0;const newIds=[];
  const send=async f=>{const im=await loadImg(f);const full=scaleTo(im,1600,0.8);let th=scaleTo(im,360,0.66);if(th.length>45000)th=scaleTo(im,260,0.55);
    const r=await PH.upload({boardId:it.boardId,itemId,caption:"",date:fileDate(f),byName:myName,boardName:(S.boards.get(it.boardId)||{}).name||"",name:f.name},full,th);if(r&&r.id)newIds.push(r.id)};
  const one=async f=>{
    try{await send(f)}
    catch(e){try{await new Promise(r=>setTimeout(r,1500));await send(f)}catch(e2){fails++;lastErr=cleanErr(e2)}}
    S.uploading.done++;render();
  };
  const worker=async()=>{while(next<list.length){const f=list[next++];await one(f)}};
  await Promise.all([worker(),worker(),worker()]);

    '<div class="modal-actions"><button class="btn primary" data-act="modal-close">Entendido</button></div>');return}
  toast((list.length===1?"Foto agregada.":list.length+" fotos agregadas."));

    '</div><div class="modal-actions"><button class="btn primary" data-act="modal-close">Listo</button></div>');
  setTimeout(()=>{const el=document.querySelector(".cap-list input");if(el)el.focus()},80);
}

function boardStats(b){
  const items=itemsOf(b.id);
  let w=0,wp=0;const counts={};
  items.forEach(i=>{const d=(i.start&&i.end)?Math.max(1,dayDiff(i.start,i.end)+1):1;w+=d;wp+=d*num(i.progress)/100;counts[i.status||"pend"]=(counts[i.status||"pend"]||0)+1});
  const g=gastosOf(b.id),inc=ingresosOf(b.id);
  const cost=g.reduce((s,x)=>s+num(x.amount),0);
  const billed=inc.reduce((s,x)=>s+num(x.amount),0);
  const collected=inc.filter(isCob).reduce((s,x)=>s+num(x.amount),0);
  const byMet={efectivo:0,transferencia:0,retiro:0,"":0};let porPagar=0;
  g.forEach(x=>{const a=num(x.amount);if(!isPaid(x)){porPagar+=a;return}const k=METODOS.some(m=>m.k===x.metodo)?x.metodo:"";byMet[k]+=a});
  const byConcept={};CONCEPTS.forEach(c=>byConcept[c]=0);g.forEach(x=>{byConcept[x.concept]=(byConcept[x.concept]||0)+num(x.amount)});
  const contract=num(b.contract),base=contract||billed;
  const util=base-cost;
  return{items,counts,phys:w?wp/w:0,late:items.filter(isLate).length,cost,billed,collected,contract,base,util,byMet,porPagar,paid:cost-porPagar,margin:base?util/base:0,
    spent:contract?cost/contract:num(b.budget)?cost/num(b.budget):0,spentLbl:contract?"Gastado del contrato":"Presupuesto ejercido",byConcept,planned:items.reduce((s,i)=>s+num(i.budget),0)};
}

function renderGantt(b){
  const groups=groupsOf(b);const its=filtered(itemsOf(b.id)).filter(i=>i.start&&i.end);
  if(!its.length)return '<div class="panel gempty">No hay actividades con fechas. Asigna inicio y fin en la tabla principal para verlas aquí.</div>';
  let min=its.map(i=>i.start).sort()[0],max=its.map(i=>i.end).sort().slice(-1)[0];
  const t=today();if(t<min)min=t;if(t>max)max=t;
  const md=parse(min);md.setDate(md.getDate()-((md.getDay()+6)%7)-7);const start=iso(md);
  const end=addDays(max,14);const days=dayDiff(start,end)+1;const W=window.innerWidth<600?5:7;const width=days*W;
  const x=s=>dayDiff(start,s)*W;
  let head='<div class="grow ghead"><div class="glabel">Actividad</div><div class="gtrack" style="width:'+width+'px;height:40px;background:repeating-linear-gradient(90deg,transparent 0,transparent '+(7*W-1)+'px,var(--line) '+(7*W-1)+'px,var(--line) '+(7*W)+'px)">';
  const d=parse(start);const endD=parse(end);
  const m=new Date(d.getFullYear(),d.getMonth(),1);
  while(m<=endD){const s=iso(m);const left=Math.max(0,x(s));head+='<span class="gmonth" style="left:'+left+'px">'+MONTHS[m.getMonth()]+" "+m.getFullYear()+'</span>';m.setMonth(m.getMonth()+1)}
  for(let k=0;k<days;k+=7){const s=addDays(start,k);head+='<span class="gweek" style="left:'+(k*W)+'px">'+parse(s).getDate()+'</span>'}
  head+='</div></div>';
  const bgTrack='background:repeating-linear-gradient(90deg,transparent 0,transparent '+(7*W-1)+'px,var(--line) '+(7*W-1)+'px,var(--line) '+(7*W)+'px)';
  let rows="";
  groups.forEach(g=>{
    const list=its.filter(i=>i.groupId===g.id);if(!list.length)return;
    rows+='<div class="grow ggroup" style="--g:'+esc(g.color)+'"><div class="glabel"><span>'+esc(g.name)+'</span></div><div class="gtrack" style="width:'+width+'px;'+bgTrack+'"></div></div>';
    list.forEach(i=>{
      const l=x(i.start),w=Math.max(W,(dayDiff(i.start,i.end)+1)*W);
      rows+='<div class="grow" style="--g:'+esc(g.color)+'"><div class="glabel">'+avatar(i.owner)+'<span>'+esc(i.name)+'</span></div><div class="gtrack" style="width:'+width+'px;'+bgTrack+'">'+
        '<div class="gbar'+(isLate(i)?" late":"")+'" data-act="open-item" data-id="'+esc(i.id)+'" style="left:'+l+'px;width:'+w+'px" title="'+esc(i.name)+': '+fmtDY(i.start)+' a '+fmtDY(i.end)+'"><i style="width:'+Math.min(100,num(i.progress))+'%"></i><span>'+(w>60?Math.round(num(i.progress))+"%":"")+'</span></div></div></div>';
    });
  });
  const tl=210+x(today())+Math.floor(W/2);
  return '<div class="gantt" id="gantt-scroll"><div class="gt" style="width:'+(210+width)+'px">'+head+rows+'<div class="gtoday" style="left:'+tl+'px" title="Hoy"></div></div></div>'+
    '<p style="color:var(--muted);font-size:12.5px">La línea roja es hoy. La parte oscura de cada barra es el avance capturado; el contorno rojo marca actividades vencidas sin terminar.</p>';
}

function finRow(label,v,opts){opts=opts||{};return '<div class="er-row'+(opts.cls?" "+opts.cls:"")+'"><span>'+(opts.sign?'<i class="er-sign">'+opts.sign+'</i>':"")+label+(opts.sub?'<small>'+opts.sub+'</small>':"")+'</span><b class="'+(v<0?"neg":"")+'">'+money(v)+(opts.pct!=null?'<em class="er-pct">'+opts.pct+'</em>':"")+'</b></div>'}

  h+='<div class="panel fin-sec"><div class="fin-h"><h3>Gastos</h3><span class="fin-tot">'+money(st.paid)+'</span></div>'+
    form("g",'<label>Tipo<select id="g-met" data-draft="g-met">'+PAGOS.map(m=>'<option value="'+m.k+'"'+(draftVal("g-met","transferencia")===m.k?" selected":"")+'>'+m.label+'</option>').join("")+'</select></label>',"add-gasto","Agregar gasto",retFld)+
    '<div class="gcols">'+groups.map(({m,arr})=>'<div class="gcol" style="--fc:'+m.c+'"><div class="gcol-h"><span>'+m.label+'</span><b>'+money(st.byMet[m.k])+'</b></div>'+list(arr,x=>{const rt=m.k==="efectivo"?retOf(x.id):0;return row(x,gDesc(x),rt?'<em class="ret-note">disposición '+money(rt)+(num(x.amount)?" ("+(Math.round(rt/num(x.amount)*10000)/100)+"%)":"")+'</em>':"","del-gasto")},m.k==="retiro"?"Sin costos de retiro.":"Sin gastos.")+'</div>').join("")+'</div>'+
    (sinTipo.length?'<div class="gcol" style="--fc:#9b9b9b;margin-top:12px"><div class="gcol-h"><span>Sin tipo (capturados antes; toca el botón para asignarles uno)</span><b>'+money(st.byMet[""])+'</b></div>'+list(sinTipo,x=>row(x,gDesc(x),'<button class="btn sm" data-act="gasto-met" data-id="'+esc(x.id)+'">Asignar tipo</button>',"del-gasto"),"")+'</div>':"")+
  '</div>';

    '<div class="panel fin-sec"><div class="fin-h"><h3>Cuentas por cobrar</h3><span class="fin-tot" style="color:var(--warn)">'+money(porCobrar)+'</span></div>'+

      form("p","","add-cxp","Agregar")+list(cxp,x=>row(x,gDesc(x),'<button class="btn sm" data-act="pagar" data-id="'+esc(x.id)+'">Pagado</button>',"del-gasto"),"No hay pagos pendientes.")+'</div>'+

    (st.byMet[""]?finRow("Gastos sin tipo",-st.byMet[""],{sign:"−"}):"")+
    finRow("Cuentas por pagar",-st.porPagar,{sign:"−"})+
    (st.contract?finRow("Total gastado",-st.cost,{cls:"sub-tot",pct:pct(st.cost/st.contract)+" del contrato"}):"")+
    finRow("Utilidad bruta",st.util,{cls:"total",pct:st.base?pct(st.margin):null})+
  '</div>';
  return h;
}
function diasTxt(d){if(!d)return"";const n=dayDiff(d,today());return n<=0?"hoy":n===1?"hace 1 día":"hace "+n+" días"}
function tile(t,v,s,cls){return '<div class="tile'+(cls?" "+cls:"")+'"><div class="t">'+t+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':"")+'</div>'}

/* ---- avance programado, curva e historial ---- */
function planSpan(b,i){if(i.start&&i.end)return[i.start,i.end];if(b&&b.start&&b.end)return[b.start,b.end];return null}
function plannedAt(b,items,t){let w=0,wp=0;items.forEach(i=>{const sp=planSpan(b,i);if(!sp)return;const d=Math.max(1,dayDiff(sp[0],sp[1])+1);w+=d;wp+=Math.max(0,Math.min(d,dayDiff(sp[0],t)+1))});return w?wp/w:null}
function gapCls(g){return g<=-0.1?"bad":g<-0.03?"mid":"ok"}
function gapTxt(g){const n=Math.round(g*100);return(n>0?"+":"")+n+" pts"}
function progChart(stats){
  const rows=stats.map(({b,st})=>({b,real:st.phys,prog:plannedAt(b,st.items,today())})).filter(r=>r.prog!=null);
  if(!rows.length)return '<p class="hint">Pon fechas a las actividades para comparar lo programado con lo real.</p>';
  rows.sort((x,y)=>(x.real-x.prog)-(y.real-y.prog));
  return '<div class="pv-list">'+rows.map(r=>{const g=r.real-r.prog;
    return '<div class="pv-row"><button class="pv-name" data-act="nav-board" data-id="'+esc(r.b.id)+'" title="'+esc(r.b.name)+'">'+esc(r.b.name)+'</button><div class="pv-bars">'+
      '<div class="pv-bar" title="Programado: '+pct(r.prog)+'"><i style="width:'+Math.min(100,r.prog*100)+'%;background:var(--muted)"></i></div>'+
      '<div class="pv-bar" title="Real: '+pct(r.real)+'"><i style="width:'+Math.min(100,r.real*100)+'%;background:var(--accent)"></i></div></div>'+
      '<div class="pv-d '+gapCls(g)+'">'+gapTxt(g)+'<span class="pv-v">'+pct(r.real)+' de '+pct(r.prog)+'</span></div></div>'}).join("")+'</div>'+
    '<div class="legend"><span><i style="background:var(--muted)"></i>Programado a hoy</span><span><i style="background:var(--accent)"></i>Avance real</span></div>';
}
function budgetChart(stats){
  const rows=stats.filter(({b,st})=>num(b.budget)||st.cost).map(({b,st})=>({b,bud:num(b.budget),cost:st.cost,phys:st.phys}));
  if(!rows.length)return '<p class="hint">Captura el presupuesto de cada obra en "Datos de la obra" para ver esta gráfica.</p>';
  const mx=Math.max(1,...rows.map(r=>Math.max(r.bud,r.cost)));
  rows.sort((x,y)=>(y.bud?y.cost/y.bud:0)-(x.bud?x.cost/x.bud:0));
  return '<div class="pv-list">'+rows.map(r=>{const used=r.bud?r.cost/r.bud:0;const cls=!r.bud?"mid":used>r.phys+0.1?"bad":used>r.phys+0.03?"mid":"ok";
    return '<div class="pv-row"><button class="pv-name" data-act="nav-board" data-id="'+esc(r.b.id)+'" title="'+esc(r.b.name)+'">'+esc(r.b.name)+'</button><div class="pv-bars">'+
      '<div class="pv-bar" title="Presupuesto: '+money(r.bud)+'"><i style="width:'+(r.bud/mx*100)+'%;background:var(--brand)"></i></div>'+
      '<div class="pv-bar" title="Costo real: '+money(r.cost)+'"><i style="width:'+(r.cost/mx*100)+'%;background:'+(cls==="bad"?"var(--bad)":"var(--accent)")+'"></i></div></div>'+
      '<div class="pv-d '+cls+'">'+(r.bud?pct(used):"sin ppto.")+'<span class="pv-v">'+shortM(r.cost)+' de '+shortM(r.bud)+'</span></div></div>'}).join("")+'</div>'+
    '<div class="legend"><span><i style="background:var(--brand)"></i>Presupuesto</span><span><i style="background:var(--accent)"></i>Costo real</span><span>En rojo si se gastó más de lo que va de avance</span></div>';
}
function curveChart(b,st){
  const items=st.items;let a=b.start||"",z=b.end||"";
  items.forEach(i=>{if(i.start&&(!a||i.start<a))a=i.start;if(i.end&&(!z||i.end>z))z=i.end});
  const snaps=S.avance.filter(x=>x.boardId===b.id&&x.date).sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  if(snaps.length&&(!a||snaps[0].date<a))a=snaps[0].date;
  const t=today();if(!a||!z||dayDiff(a,z)<1)return '<div class="panel"><h3>Curva de avance</h3><p class="hint">Pon fechas de inicio y fin a las actividades (o a la obra) para ver la curva.</p></div>';
  if(t>z&&b.status!=="Terminada")z=t;
  const days=dayDiff(a,z),W=720,H=260,L=40,R=12,T=12,B=28;
  const x=d=>L+(W-L-R)*Math.max(0,Math.min(1,dayDiff(a,d)/days)),y=v=>T+(H-T-B)*(1-Math.max(0,Math.min(1,v)));
  let g="";for(let k=0;k<=4;k++){const v=k/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(k*25)+'%</text>'}
  const d0=parse(a);const mstep=days>500?3:days>200?2:1;let m=new Date(d0.getFullYear(),d0.getMonth()+1,1);let n=0;
  while(iso(m)<=z){if(n%mstep===0){const xs=x(iso(m));g+='<line x1="'+xs+'" x2="'+xs+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-dasharray="2 4"/><text x="'+xs+'" y="'+(H-9)+'" text-anchor="middle">'+MONTHS[m.getMonth()]+(m.getMonth()===0?" "+String(m.getFullYear()).slice(2):"")+'</text>'}m=new Date(m.getFullYear(),m.getMonth()+1,1);n++}
  const N=Math.min(120,days);let pp="";for(let k=0;k<=N;k++){const d=addDays(a,Math.round(days*k/N));const v=plannedAt(b,items,d)||0;pp+=(k?"L":"M")+x(d).toFixed(1)+" "+y(v).toFixed(1)}
  const pts=snaps.filter(s=>s.date<t).map(s=>({d:s.date,v:num(s.phys)}));pts.push({d:t<=z?t:z,v:st.phys});
  const rp=pts.map((p,k)=>(k?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join("");
  const prog=plannedAt(b,items,t);const gap=prog==null?0:st.phys-prog;
  let svg='<svg class="svgchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Curva de avance programado contra real">'+g+
    '<path d="'+pp+'" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="6 4"/>'+
    (t>=a&&t<=z?'<line x1="'+x(t)+'" x2="'+x(t)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--warn)" stroke-width="1.5"/><text x="'+(x(t)+4)+'" y="'+(T+10)+'" style="fill:var(--warn);font-weight:700">Hoy</text>':"")+
    '<path d="'+rp+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>'+
    pts.map(p=>'<circle cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(p.d===t?5:3)+'" fill="var(--accent)"><title>'+fmtDY(p.d)+': '+pct(p.v)+'</title></circle>').join("")+'</svg>';
  const first=snaps.length?snaps[0].date:t;
  return '<div class="panel"><h3>Curva de avance</h3>'+
    '<div class="curve-sum"><div><b>'+pct(st.phys)+'</b>avance real</div>'+(prog!=null?'<div><b>'+pct(prog)+'</b>programado a hoy</div><div><b class="'+(gap<-0.03?"neg":"")+'">'+gapTxt(gap)+'</b>'+(gap<-0.03?"atrás de lo programado":gap>0.03?"adelante de lo programado":"en tiempo")+'</div>':"")+
    '<div><b>'+fmtDY(a)+'</b>inicio</div><div><b>'+fmtDY(z)+'</b>terminación</div></div>'+svg+
    '<div class="legend"><span><i style="background:var(--muted)"></i>Programado (según las fechas de las actividades)</span><span><i style="background:var(--accent)"></i>Real</span></div>'+
    '<p class="hint" style="margin-top:10px">El avance real se guarda cada día que alguien mueve el avance de una actividad. Esta obra tiene registro desde el '+fmtDY(first)+'.</p></div>';
}
const HF={progress:"el avance",status:"el estatus",name:"el nombre",owner:"el responsable",priority:"la prioridad",start:"la fecha de inicio",end:"la fecha de fin",budget:"el presupuesto",notes:"las notas",groupId:"el área",client:"el cliente",location:"la ubicación",resident:"el residente",contract:"el monto del contrato",seccion:"la sección",date:"la fecha",concept:"el concepto",provider:"el proveedor",desc:"la descripción",invoice:"la factura",amount:"el monto",type:"el tipo",number:"el número",collected:"el cobro",metodo:"la forma de pago",pagado:"el pago"};
function hv(v){v=String(v==null?"":v);return /^\d{4}-\d{2}-\d{2}$/.test(v)?fmtDY(v):v}
function histText(h){
  const nm=h.rowName?'"'+esc(h.rowName)+'"':"";const bf=esc(hv(h.before)),af=esc(hv(h.after));
  const what=({items:"la actividad ",boards:"la obra ",gastos:"un gasto ",ingresos:"un ingreso "})[h.col]||"";
  if(h.action==="foto")return "subió una foto en "+nm;
  if(h.action==="comentario")return "comentó en "+nm+(af?': <span class="hm" style="font-size:13px">'+af+'</span>':"");
  if(h.action==="crear"){if(h.col==="items")return "agregó la actividad "+nm;if(h.col==="boards")return "creó la obra "+nm;return "registró "+what+"de "+af+(h.rowName?" ("+esc(h.rowName)+")":"")}
  if(h.action==="borrar"){if(h.col==="fotos")return "borró una foto de "+nm;if(h.col==="items"||h.col==="boards")return "borró "+what+nm;return "borró "+what+"de "+bf+(h.rowName?" ("+esc(h.rowName)+")":"")}
  if(h.field==="groups")return "cambió las áreas de la obra "+nm;
  if(h.field==="members")return "cambió quién tiene acceso a la obra "+nm;
  if(h.field==="name")return "cambió el nombre de "+what+'"'+bf+'" a "'+af+'"';
  if(h.field==="notes")return "editó las notas de "+nm;
  const ref=h.col==="gastos"||h.col==="ingresos"?what+(h.rowName?"("+esc(h.rowName)+")":""):(h.col==="boards"?"la obra ":"")+nm;
  return "cambió "+(HF[h.field]||h.field)+" de "+ref+(bf?" de <b>"+bf+"</b>":"")+" a <b>"+(af||"vacío")+"</b>";
}
function histWhen(ts){const d=new Date(ts);if(isNaN(d))return"";return pad(d.getHours())+":"+pad(d.getMinutes())}
function histDay(ts){const d=new Date(ts);if(isNaN(d))return"";const k=iso(d),t=today();if(k===t)return"Hoy";if(k===addDays(t,-1))return"Ayer";return d.getDate()+" "+MONTHS[d.getMonth()].toLowerCase()+" "+d.getFullYear()}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()}
function histList(list,showBoard,grouped){
  if(!list.length)return '<p class="hint">Todavía no hay cambios registrados.</p>';

function renderER(stats){
  const st=stats||boardsArr().map(b=>({b,st:boardStats(b)}));
  const S2=k=>st.reduce((a,x)=>a+num(x.st[k]),0);
  const met=k=>st.reduce((a,x)=>a+num(x.st.byMet[k]),0);
  const conC=st.filter(x=>x.st.contract),sinC=st.filter(x=>!x.st.contract);
  const contratos=conC.reduce((a,x)=>a+x.st.contract,0),fact=sinC.reduce((a,x)=>a+x.st.billed,0);
  const ventas=contratos+fact;
  const costo=S2("cost"),ub=ventas-costo;
  const of=[...S.gastos.values()].filter(g=>g.boardId===OFICINA);
  const fcat=k=>of.filter(x=>(FIJOS.some(c=>c.k===x.itemId)?x.itemId:"")===k).reduce((a,x)=>a+num(x.amount),0);
  const fijos=of.reduce((a,x)=>a+num(x.amount),0),uo=ub-fijos;
  const P=v=>ventas?pct(v/ventas):null;
  return '<div class="panel fin-er"><h3>Estado de resultados</h3><p class="hint">Todas las obras juntas.</p>'+
    finRow("Monto de contratos",contratos,{pct:fact?P(contratos):null})+
    (fact?finRow("Ingresos de obras sin contrato",fact,{sign:"+",pct:P(fact)}):"")+
    PAGOS.map(m=>finRow("Gastos en "+m.label.toLowerCase(),-met(m.k),{sign:"−",pct:P(met(m.k))})).join("")+
    finRow("Costo de retiro de efectivo",-met("retiro"),{sign:"−",pct:P(met("retiro"))})+
    (met("")?finRow("Gastos sin tipo",-met(""),{sign:"−",pct:P(met(""))}):"")+
    finRow("Cuentas por pagar",-S2("porPagar"),{sign:"−",pct:P(S2("porPagar"))})+
    finRow("Utilidad bruta",ub,{cls:"total",pct:P(ub)})+
    FIJOS.map(c=>finRow("Gastos fijos: "+c.label,-fcat(c.k),{sign:"−",pct:P(fcat(c.k))})).join("")+
    (fcat("")?finRow("Gastos fijos sin categoría",-fcat(""),{sign:"−",pct:P(fcat(""))}):"")+
    finRow("Utilidad de operación",uo,{cls:"total",pct:P(uo)})+
  '</div>';
}

/* ---------- pop ---------- */
let popAnchor=null;
function openPop(anchor,html){
  const p=$("#pop");p.innerHTML=html;p.hidden=false;popAnchor=anchor;
  const r=anchor.getBoundingClientRect();const pw=p.offsetWidth,ph=p.offsetHeight;
  let left=r.left+r.width/2-pw/2;left=Math.max(8,Math.min(window.innerWidth-pw-8,left));
  let top=r.bottom+6;if(top+ph>window.innerHeight-8)top=Math.max(8,r.top-ph-6);
  p.style.left=left+"px";p.style.top=top+"px";
  const f=p.querySelector("input:not([type=date]):not([type=range]):not([type=number])");if(f&&window.matchMedia&&window.matchMedia("(pointer:fine)").matches)setTimeout(()=>f.focus(),10);
}

function addItem(gid,name){
  const b=S.boards.get(S.boardId);if(!b||!name.trim())return;
  const its=itemsOf(b.id);const order=its.reduce((m,i)=>Math.max(m,num(i.order)),0)+1;

const A={
  "open-side":()=>{$("#side").classList.add("open");$("#scrim").classList.add("open")},
  "close-side":closeSide,
  "nav-users":()=>{S.view="users";S.drawer=null;closeSide();render();if(AUTH.refreshUsers)AUTH.refreshUsers()},
  "user-new":()=>userModal(null),
  "user-edit":t=>userModal((S.users||[]).find(u=>u.id===t.dataset.id)||null),
  "user-save":async t=>{if(!AUTH.saveUser)return;const f=$("#user-form");const fd=new FormData(f);
    const p={id:t.dataset.id||"",nombre:String(fd.get("nombre")||"").trim(),usuario:String(fd.get("usuario")||"").trim().toLowerCase(),clave:String(fd.get("clave")||""),
      rol:String(fd.get("rol")||"usuario"),secciones:fd.getAll("s").map(String),finanzas:!!fd.get("finanzas"),activo:t.dataset.id?!!fd.get("activo"):true,obras:fd.getAll("o").map(String)};
    const err=$("#uf-err");const say=m=>{if(err)err.textContent=m};
    if(!p.nombre||!p.usuario){say("Escribe el nombre y el usuario.");return}
    if(p.rol==="admin_sec"&&!p.secciones.length){say("Marca al menos una sección para el administrador de sección.");return}
    if(!/^[a-z0-9._-]{3,30}$/.test(p.usuario)){say("El usuario debe tener de 3 a 30 letras sin acentos, números, punto o guion.");return}
    if(!p.id&&p.clave.length<6){say("La contraseña debe tener al menos 6 caracteres.");return}
    if(p.id&&p.clave&&p.clave.length<6){say("La contraseña nueva debe tener al menos 6 caracteres.");return}
    t.disabled=true;say("Guardando");
    try{await AUTH.saveUser(p);closeModal();toast(p.id?"Usuario actualizado.":"Usuario creado. Pásale su usuario y contraseña.")}catch(e){t.disabled=false;say(cleanErr(e))}},
  "me-menu":t=>openPop(t,'<button class="menu-opt" data-act="pass-change">Cambiar mi contraseña</button><button class="menu-opt danger" data-act="logout">Salir</button>'),
  "pass-change":()=>{closePop();openModal('<h2>Cambiar mi contraseña</h2><form id="pass-form" class="form-grid"><label class="full">Contraseña actual<input class="inp" type="password" name="old" autocomplete="current-password"></label><label class="full">Contraseña nueva<input class="inp" type="password" name="n1" autocomplete="new-password"></label><label class="full">Repite la nueva<input class="inp" type="password" name="n2" autocomplete="new-password"></label></form><p class="lg-err" id="pf-err"></p><div class="modal-actions"><button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="pass-save">Guardar</button></div>')},
  "pass-save":async t=>{const fd=new FormData($("#pass-form"));const e=$("#pf-err");const o=String(fd.get("old")||""),n1=String(fd.get("n1")||""),n2=String(fd.get("n2")||"");
    if(n1.length<6){e.textContent="La contraseña nueva debe tener al menos 6 caracteres.";return}if(n1!==n2){e.textContent="Las contraseñas nuevas no coinciden.";return}
    t.disabled=true;try{await AUTH.changePass(o,n1);closeModal();toast("Contraseña actualizada.")}catch(x){t.disabled=false;e.textContent=cleanErr(x)}},
  "logout":()=>{closePop();if(AUTH.logout)AUTH.logout()},
  "do-login":()=>{if(AUTH.login)AUTH.login()},
  "do-setup":()=>{if(AUTH.setup)AUTH.setup()},
  "nav-panel":()=>{S.view="panel";S.drawer=null;saveUi();closeSide();render()},
  "nav-fijos":()=>{S.view="fijos";S.drawer=null;saveUi();closeSide();render();$("#main").scrollTop=0},

  "modal-close":closeModal,
  "confirm-yes":()=>{const f=confirmFn;confirmFn=null;closeModal();if(f)f()},

document.addEventListener("click",e=>{
  const pop=$("#pop");
  if(!pop.hidden&&!pop.contains(e.target)&&!(popAnchor&&popAnchor.contains(e.target)))closePop();
  const m=$("#modal");if(!m.hidden&&e.target===m){closeModal();return}
  const t=e.target.closest("[data-act]");if(!t)return;
  if(t.closest(".card")&&t.dataset.act!=="open-item"&&t.closest(".card")!==t)return;
  const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}
});
function bindValue(t){
  const [col,id,field,type]=t.dataset.bind.split("|");const cur=S[col].get(id);if(!cur)return;
  let v=type==="num"?num(t.value):t.value;
  if(field==="name"){v=String(v).trim()||"Sin nombre"}
  if(cur[field]===v)return;
  const p={};p[field]=v;
  if(col==="items"&&field==="progress"){if(v>=100)p.status="listo";else if(v>0&&(cur.status||"pend")==="pend")p.status="curso"}
  if(col==="items"&&field==="start"&&v&&cur.end&&cur.end<v)p.end=v;
  if(col==="items"&&field==="end"&&v&&cur.start&&v<cur.start)p.start=v;
  if(col==="items"&&(field==="start"||field==="end")){const s=p.start!==undefined?p.start:(field==="start"?v:cur.start);const en=p.end!==undefined?p.end:(field==="end"?v:cur.end);
    if(field==="start"&&v&&!cur.end)p.end=v;if(field==="end"&&v&&!cur.start)p.start=v;
    const d=document.getElementById("pd-d");if(d&&s&&en)d.value=dayDiff(p.start||s,p.end||en)+1;}
  patch(col,id,p);
}

  const t=e.target;
  if(t.dataset.bind){bindValue(t);return}
  if(t.dataset.upload){const fl=t.files;if(fl&&fl.length)uploadFiles(fl,t.dataset.upload);t.value="";return}
  if(t.id==="r-up-item"){S.rUpItem=t.value;return}

  if(t.dataset.cap){const f=S.fotos.get(t.dataset.cap);const v=t.value.trim();if(f&&(f.caption||"")!==v)PH.caption(f,v);return}
  if(t.id==="r-item"){S.rItem=t.value;render();return}
  if(t.id==="r-from"){S.rFrom=t.value;render();return}
  if(t.id==="r-to"){S.rTo=t.value;render();return}
  if(t.dataset.dur){const i=S.items.get(t.dataset.dur);const n=Math.max(1,Math.round(num(t.value)));const s=i.start||today();patch("items",i.id,{start:s,end:addDays(s,n-1)});const e2=$("#pd-e"),s2=$("#pd-s");if(e2)e2.value=addDays(s,n-1);if(s2)s2.value=s;return}
  if(t.dataset.groupName){const b=S.boards.get(S.boardId);const n=t.value.trim()||"Grupo";setGroups(b,groupsOf(b).map(g=>g.id===t.dataset.groupName?Object.assign({},g,{name:n}):g));return}
  if(t.id==="f-person"){S.fPerson=t.value;render()}
  else if(t.id==="f-status"){S.fStatus=t.value;render()}
  else if(t.id==="f-year"){S.year=+t.value;render()}

/* visor de fotos: acercar con pellizco, rueda o doble toque; arrastrar para moverse; deslizar para cambiar */
const ZM={s:1,x:0,y:0,pts:new Map(),start:null,lastTap:0,
  img(){return document.getElementById("lb-img")},
  reset(){this.s=1;this.x=0;this.y=0;this.pts.clear();this.start=null;this.apply()},
  clamp(){const im=this.img();if(!im)return;const w=im.offsetWidth,h=im.offsetHeight;
    if(this.s<=1){this.s=1;this.x=0;this.y=0;return}
    const mx=w*(this.s-1),my=h*(this.s-1);this.x=Math.min(0,Math.max(-mx,this.x));this.y=Math.min(0,Math.max(-my,this.y))},
  apply(){const im=this.img();if(!im)return;this.clamp();im.style.transform="translate("+this.x+"px,"+this.y+"px) scale("+this.s+")";
    const st=document.getElementById("lb-stage");if(st)st.classList.toggle("zoomed",this.s>1)},
  zoomAt(ns,cx,cy){const im=this.img();if(!im)return;ns=Math.max(1,Math.min(5,ns));const r=im.getBoundingClientRect();
    const px=(cx-r.left)/this.s,py=(cy-r.top)/this.s;this.x+=(this.s-ns)*px;this.y+=(this.s-ns)*py;this.s=ns;this.apply()},
  zoomCenter(f){const im=this.img();if(!im)return;const r=im.getBoundingClientRect();this.zoomAt(this.s*f,r.left+r.width/2,r.top+r.height/2)}
};
A["lb-zin"]=()=>ZM.zoomCenter(1.6);A["lb-zout"]=()=>ZM.zoomCenter(1/1.6);
document.addEventListener("pointerdown",e=>{if(!LB)return;const st=e.target.closest&&e.target.closest("#lb-stage");if(!st||e.target.closest(".lb-nav"))return;
  e.preventDefault();ZM.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  ZM.start={s:ZM.s,x:ZM.x,y:ZM.y,pts:new Map([...ZM.pts].map(([k,v])=>[k,{x:v.x,y:v.y}])),t:Date.now()}});
document.addEventListener("pointermove",e=>{if(!LB||!ZM.pts.has(e.pointerId)||!ZM.start)return;ZM.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const P=[...ZM.pts.values()],S0=[...ZM.start.pts.values()];
  if(P.length>=2&&S0.length>=2){const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const c=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
    const im=ZM.img();if(!im)return;const ns=Math.max(1,Math.min(5,ZM.start.s*d(P[0],P[1])/Math.max(1,d(S0[0],S0[1]))));
    const c0=c(S0[0],S0[1]),c1=c(P[0],P[1]);const r=im.parentNode.getBoundingClientRect();const base={x:im.offsetLeft+r.left,y:im.offsetTop+r.top};
    const px=(c0.x-base.x-ZM.start.x)/ZM.start.s,py=(c0.y-base.y-ZM.start.y)/ZM.start.s;
    ZM.s=ns;ZM.x=c1.x-base.x-px*ns;ZM.y=c1.y-base.y-py*ns;ZM.apply()}
  else if(P.length===1&&ZM.start.s>1){const a=S0[0]||P[0];ZM.x=ZM.start.x+(P[0].x-a.x);ZM.y=ZM.start.y+(P[0].y-a.y);ZM.apply()}});
const zEnd=e=>{if(!LB||!ZM.pts.has(e.pointerId))return;const st=ZM.start;const a=st&&st.pts.get(e.pointerId);ZM.pts.delete(e.pointerId);
  if(st&&a&&st.pts.size===1&&ZM.pts.size===0){const dx=e.clientX-a.x,dy=e.clientY-a.y;
    if(Math.abs(dx)<10&&Math.abs(dy)<10){const now=Date.now();if(now-ZM.lastTap<320){ZM.lastTap=0;if(ZM.s>1)ZM.reset();else ZM.zoomAt(2.5,e.clientX,e.clientY)}else ZM.lastTap=now}
    else if(st.s<=1&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)&&LB.list.length>1)A[dx>0?"lb-prev":"lb-next"]()}
  ZM.start=ZM.pts.size?{s:ZM.s,x:ZM.x,y:ZM.y,pts:new Map([...ZM.pts].map(([k,v])=>[k,{x:v.x,y:v.y}]))}:null};
document.addEventListener("pointerup",zEnd);document.addEventListener("pointercancel",zEnd);
document.addEventListener("wheel",e=>{if(!LB)return;const st=e.target.closest&&e.target.closest("#lb-stage");if(!st)return;e.preventDefault();ZM.zoomAt(ZM.s*(e.deltaY<0?1.15:1/1.15),e.clientX,e.clientY)},{passive:false});

  ["lg-pass","lg-pass2"].forEach(k=>delete S.draft[k]);S.authErr="";S.authBusy=false;S.mode="loading";ver=-1;render();schedulePoll(0)}

let pollTimer=null;
function schedulePoll(ms){clearTimeout(pollTimer);pollTimer=setTimeout(poll,ms==null?4000:ms)}
async function poll(){
  if(!TOKEN){return}
  if(document.hidden){schedulePoll(15000);return}
  if(flushing||pendingOps.length){schedulePoll(1500);return}
  const asked=ver;
  try{const r=await api("poll",ver);
    if(r&&!r.same&&!flushing&&!pendingOps.length&&ver===asked)applyAll(r);
    if(S.netNote&&!flushing)S.netNote="";
  }catch(e){if(!TOKEN)return;S.netNote="Sin conexión, reintentando"}
  renderConn();schedulePoll();
}
